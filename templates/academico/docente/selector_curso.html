<section class="panel-curso"><form method="get" id="seleccion-curso" data-seleccion><label for="curso">Mi curso</label><select name="curso" id="curso" required><option value="">Seleccione un curso</option>{% for item in cursos %}<option value="{{ item.pk }}" {% if curso.pk == item.pk %}selected{% endif %}>{{ item.materia.codigo_materia }} · Ciclo {{ item.ciclo.numero_ciclo }} · {{ item.ciclo.anio }} · {{ item.estado }}</option>{% endfor %}</select><button type="submit" class="boton-secundario">{{ accion }}</button></form><details class="ui-ayuda"><summary>Ver nombres completos de mis cursos</summary><ul class="f84-catalogo">{% for item in cursos %}<li><a href="{% url destino %}?curso={{ item.pk }}">{{ item.materia.nombre }}</a><small>{{ item.ciclo }} · Ciclo formativo {{ item.materia.numero_ciclo_formativo }} · {{ item.estado }}</small></li>{% empty %}<li>No hay cursos asignados a su cuenta docente.</li>{% endfor %}</ul></details></section>
