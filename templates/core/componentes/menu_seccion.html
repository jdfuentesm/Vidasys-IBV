{% if grupo %}<nav class="ui-seccion-nav" aria-label="Navegación de {{ grupo.titulo }}"><p>{{ grupo.titulo }}{% for item in grupo.enlaces %}{% if item.activo %}<span aria-hidden="true"> / </span><strong>{{ item.titulo }}</strong>{% endif %}{% endfor %}</p><details class="ui-cambio-seccion"><summary>Cambiar de sección</summary><ul>{% for item in grupo.enlaces %}<li><a href="{{ item.url }}" {% if item.activo %}aria-current="page"{% endif %}>{{ item.titulo }}</a></li>{% endfor %}</ul></details></nav>{% endif %}
