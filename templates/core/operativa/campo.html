{% load operativa %}<div class="f83-campo{% if campo.errors %} f83-campo-error{% endif %}"><label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span aria-label="obligatorio">*</span>{% endif %}</label>{{ campo|campo_operativo }}{% if campo.help_text %}{% if plegar_ayuda %}<details><summary>Condiciones de esta obligación</summary>{% endif %}<small id="{{ campo.auto_id }}_helptext">{{ campo.help_text }}</small>{% if plegar_ayuda %}</details>{% endif %}{% endif %}{{ campo.errors }}</div>
