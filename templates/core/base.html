<!DOCTYPE html>
<html lang="es">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VidaSys-IBV{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link Dashboard CSS -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta institucional IBV */
            --color-primario: #1E3A5F;
            --color-primario-claro: #2563EB;
            --color-acento: #DC2626;
            --color-exito: #16A34A;
            --color-advertencia: #F59E0B;
            --color-peligro: #DC2626;
            --color-fondo: #F8FAFC;
            --color-texto: #1F2937;
            --color-texto-secundario: #6B7280;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--color-fondo);
            color: var(--color-texto);
            min-height: 100vh;
        }

        .btn-primario {
            background-color: var(--color-primario);
            border-color: var(--color-primario);
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            min-height: 48px;
        }

        .btn-primario:hover {
            background-color: var(--color-primario-claro);
            border-color: var(--color-primario-claro);
            color: white;
        }

        .form-control {
            min-height: 44px;
            font-size: 16px;
            border-radius: 6px;
        }

        label {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--color-texto);
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
